name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      is_draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_name: postcrab-linux-x86_64.AppImage

          - name: macOS arm64 (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            archive_name: postcrab-macos-arm64.dmg

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            archive_name: postcrab-windows-x86_64-setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libadwaita-1-dev \
            pkg-config \
            librsvg2-bin \
            libfuse2t64 \
            file \
            wget \
            desktop-file-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk4 gtksourceview5 adwaita-icon-theme pkg-config

      - name: Setup MSYS2 for Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            zip

      - name: Setup Rust GNU toolchain for Windows
        if: runner.os == 'Windows'
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install stable-x86_64-pc-windows-gnu --default

      - name: Build and Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --target ${{ matrix.platform.target }}

          # Construct AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/glib-2.0/schemas
          mkdir -p AppDir/usr/share/gtksourceview-5

          # Main application binary
          cp target/${{ matrix.platform.target }}/release/postcrab-r4 AppDir/usr/bin/

          # Desktop entry and icon
          cp resources/postcrab.desktop AppDir/
          cp resources/postcrab.desktop AppDir/usr/share/applications/
          cp resources/postcrab.svg AppDir/
          cp resources/postcrab.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Render 256x256 PNG icon
          rsvg-convert -w 256 -h 256 resources/postcrab.svg -o AppDir/postcrab.png
          cp AppDir/postcrab.png AppDir/.DirIcon
          cp AppDir/postcrab.png AppDir/usr/share/icons/hicolor/256x256/apps/postcrab.png

          # GLib schemas & GtkSourceView-5 syntax data
          cp -r /usr/share/glib-2.0/schemas/* AppDir/usr/share/glib-2.0/schemas/
          glib-compile-schemas AppDir/usr/share/glib-2.0/schemas/

          if [ -d /usr/share/gtksourceview-5 ]; then
            cp -r /usr/share/gtksourceview-5/* AppDir/usr/share/gtksourceview-5/
          fi

          # AppRun entrypoint
          cp resources/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # Download and execute appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          ./appimagetool AppDir "${{ matrix.platform.archive_name }}"

      - name: Build and Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$PKG_CONFIG_PATH"
          cargo build --release --locked --target ${{ matrix.platform.target }}

          APP_DIR="package/PostCrab.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources/share"

          cp target/${{ matrix.platform.target }}/release/postcrab-r4 "$APP_DIR/Contents/MacOS/postcrab-r4"
          cp resources/Info.plist "$APP_DIR/Contents/Info.plist"

          SOURCEVIEW_SHARE="$(brew --prefix gtksourceview5)/share/gtksourceview-5"
          if [ -d "$SOURCEVIEW_SHARE" ]; then
            cp -r "$SOURCEVIEW_SHARE" "$APP_DIR/Contents/Resources/share/"
          fi

          mkdir -p dmg_root
          cp -r "$APP_DIR" dmg_root/
          cp README.md dmg_root/
          ln -s /Applications dmg_root/Applications

          hdiutil create -volname "PostCrab" -srcfolder dmg_root -ov -format UDZO "${{ matrix.platform.archive_name }}"

      - name: Build and Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/ucrt64/lib/pkgconfig"
        run: |
          cargo build --release --locked --target ${{ matrix.platform.target }}

          PKG_DIR="package/postcrab-windows-x86_64"
          mkdir -p "$PKG_DIR/share"
          cp target/${{ matrix.platform.target }}/release/postcrab-r4.exe "$PKG_DIR/"
          cp README.md "$PKG_DIR/"

          UCRT_PREFIX="$(cygpath -u "$MINGW_PREFIX")"
          cp -r "$UCRT_PREFIX/share/glib-2.0" "$PKG_DIR/share/"
          cp -r "$UCRT_PREFIX/share/gtksourceview-5" "$PKG_DIR/share/"
          if [ -d "$UCRT_PREFIX/share/icons" ]; then
            cp -r "$UCRT_PREFIX/share/icons" "$PKG_DIR/share/"
          fi
          glib-compile-schemas "$PKG_DIR/share/glib-2.0/schemas/"

          python3 - << 'PYEOF'
          import os, sys, subprocess, shutil

          pkg_dir = "package/postcrab-windows-x86_64"
          copied = set()
          to_scan = [os.path.join(pkg_dir, "postcrab-r4.exe")]
          ucrt_bin = os.path.join(sys.prefix, "bin")

          while to_scan:
              curr = to_scan.pop()
              res = subprocess.run(["ldd", curr], capture_output=True, text=True)
              for line in res.stdout.splitlines():
                  for token in line.strip().split():
                      clean = token.strip("()").replace("\\", "/")
                      if clean.lower().endswith(".dll"):
                          if os.path.isfile(clean):
                              dll_path = clean
                          elif os.path.isfile(os.path.join(ucrt_bin, os.path.basename(clean))):
                              dll_path = os.path.join(ucrt_bin, os.path.basename(clean))
                          else:
                              continue
                          if "windows" not in dll_path.lower() and "system32" not in dll_path.lower():
                              dll_name = os.path.basename(dll_path)
                              if dll_name not in copied:
                                  copied.add(dll_name)
                                  dest = os.path.join(pkg_dir, dll_name)
                                  shutil.copy2(dll_path, dest)
                                  to_scan.append(dest)
          print(f"Copied {len(copied)} runtime DLLs for Windows package.")
          PYEOF

      - name: Compile Inno Setup Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q resources/installer.iss

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.archive_name }}
          path: ${{ matrix.platform.archive_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          files: release-assets/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          generate_release_notes: true
